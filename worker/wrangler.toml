# Cloudflare Worker for the Sidekick AI chat. See docs/DEPLOY.md.
name = "springst-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Origins allowed to call the worker. Add your custom domain if you use one.
ALLOWED_ORIGINS = "https://satojandro.github.io"
MODEL = "claude-opus-5-5"
AI_ENABLED = "true"

# Per-IP rate limit: 10 messages per 60 seconds.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Secret (never commit it): wrangler secret put ANTHROPIC_API_KEY
